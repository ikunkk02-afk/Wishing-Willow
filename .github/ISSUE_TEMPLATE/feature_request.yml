name: Feature Request
description: Suggest a new feature for Wishing Willow
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What would you like to see added?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New Wish Capability / Action
        - Compatibility (support another mod)
        - Gameplay / Mechanics
        - AI / Provider
        - UI / Presentation
        - Other
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: How would you use this feature? What kind of wishes would it enable?
      placeholder: |
        I would like to wish for ...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
