plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

jarJar.enable()

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            // These tests intentionally reuse Minecraft's built-in empty template namespace.
            property 'forge.enabledGameTestNamespaces', 'minecraft'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    flatDir {
        dirs 'run/deobf-mods'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
}

configurations.configureEach {
    // Forge 1.20.1 provides SLF4J 2.0.1. LangChain4j only uses the stable 2.0 API;
    // resolve tests/runs against the same version and never embed a second binding.
    resolutionStrategy.force 'org.slf4j:slf4j-api:2.0.1'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    minecraftLibrary 'org.jsoup:jsoup:1.23.1'
    jarJar(group: 'org.jsoup', name: 'jsoup', version: '[1.23.1,1.24)') {
        jarJar.pin(it, '1.23.1')
    }

    // LangChain4j is orchestration-only. Wishing Willow keeps its existing
    // OpenAI-compatible HTTP provider and deliberately does not include any
    // LangChain4j provider, shell, Spring, Quarkus, or MCP integration.
    minecraftLibrary("dev.langchain4j:langchain4j:${langchain4j_version}") {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    minecraftLibrary("dev.langchain4j:langchain4j-skills:${langchain4j_skills_version}") {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    jarJar(group: 'dev.langchain4j', name: 'langchain4j', version: '[1.18.1,1.19)') { transitive = false; jarJar.pin(it, '1.18.1') }
    jarJar(group: 'dev.langchain4j', name: 'langchain4j-core', version: '[1.18.1,1.19)') { transitive = false; jarJar.pin(it, '1.18.1') }
    jarJar(group: 'dev.langchain4j', name: 'langchain4j-skills', version: '[1.18.1-beta28,1.18.1-beta29)') { transitive = false; jarJar.pin(it, '1.18.1-beta28') }
    jarJar(group: 'org.commonmark', name: 'commonmark', version: '[0.28.0,0.29)') { transitive = false; jarJar.pin(it, '0.28.0') }
    jarJar(group: 'org.commonmark', name: 'commonmark-ext-yaml-front-matter', version: '[0.28.0,0.29)') { transitive = false; jarJar.pin(it, '0.28.0') }
    jarJar(group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '[2.22,2.23)') { transitive = false; jarJar.pin(it, '2.22') }
    jarJar(group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '[2.22.1,2.23)') { transitive = false; jarJar.pin(it, '2.22.1') }
    jarJar(group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '[2.22.1,2.23)') { transitive = false; jarJar.pin(it, '2.22.1') }
    jarJar(group: 'org.apache.opennlp', name: 'opennlp-tools', version: '[2.5.9,2.6)') { transitive = false; jarJar.pin(it, '2.5.9') }
    jarJar(group: 'org.jspecify', name: 'jspecify', version: '[1.0.0,2.0)') { transitive = false; jarJar.pin(it, '1.0.0') }

    // Production Create jars use obfuscated Minecraft names. When present in the local, ignored
    // research test pack, let ForgeGradle remap them before the userdev client loads Flywheel mixins.
    fileTree('run/deobf-mods') { include 'create-*.jar' }.each { File createJar ->
        def createVersion = createJar.name.substring('create-'.length(), createJar.name.length() - '.jar'.length())
        runtimeOnly fg.deobf("local.research:create:${createVersion}")
    }
    fileTree('run/deobf-mods') { include 'modernfix-forge-*.jar' }.each { File modernFixJar ->
        def modernFixVersion = modernFixJar.name.substring('modernfix-forge-'.length(), modernFixJar.name.length() - '.jar'.length())
        runtimeOnly fg.deobf("local.research:modernfix-forge:${modernFixVersion}")
    }
    fileTree('run/deobf-mods') { include 'architectury-*-forge.jar' }.each { File architecturyJar ->
        def architecturyVersion = architecturyJar.name.substring('architectury-'.length(), architecturyJar.name.length() - '-forge.jar'.length())
        runtimeOnly fg.deobf("local.research:architectury:${architecturyVersion}:forge")
    }
    fileTree('run/deobf-mods') { include 'cavedweller-*.jar' }.each { File caveDwellerJar ->
        def caveDwellerVersion = caveDwellerJar.name.substring('cavedweller-'.length(), caveDwellerJar.name.length() - '.jar'.length())
        runtimeOnly fg.deobf("local.research:cavedweller:${caveDwellerVersion}")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.register('prepareGameTestStructures', Copy) {
    from 'src/gametest/resources/gameteststructures'
    into 'run/gameteststructures'
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('prepareGameTestStructures')
}

tasks.register('verifyAgentIsolation') {
    inputs.files(fileTree('src/main/java/com/ikunkk02/wishingwillow/agent') {
        include 'core/**/*.java', 'tool/**/*.java', 'skill/**/*.java'
    })
    doLast {
        def forbidden = ['net.minecraftforge', 'net.fabricmc', 'net.neoforged']
        inputs.files.each { source ->
            def text = source.getText('UTF-8')
            forbidden.each { prefix ->
                if (text.contains('import ' + prefix)) {
                    throw new GradleException("Loader import ${prefix} is forbidden in agent core: ${source}")
                }
            }
        }
    }
}

tasks.named('check').configure { dependsOn tasks.named('verifyAgentIsolation') }

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Thin JAR (no bundled deps) — kept for development reference but NOT for distribution.
// The jarJar output below is the player-facing artifact.
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

// jarJar produces the player-facing JAR with all runtime dependencies bundled.
// Players do NOT need to install LangChain4j, Jackson, OpenNLP, or Jsoup separately.
tasks.jarJar.configure {
    archiveClassifier = ''
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
