plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

jarJar.enable()

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'minecraft'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    flatDir {
        dirs 'run/deobf-mods'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    minecraftLibrary 'org.jsoup:jsoup:1.23.1'
    jarJar(group: 'org.jsoup', name: 'jsoup', version: '[1.23.1,1.24)') {
        jarJar.pin(it, '1.23.1')
    }

    // Production Create jars use obfuscated Minecraft names. When present in the local, ignored
    // research test pack, let ForgeGradle remap them before the userdev client loads Flywheel mixins.
    fileTree('run/deobf-mods') { include 'create-*.jar' }.each { File createJar ->
        def createVersion = createJar.name.substring('create-'.length(), createJar.name.length() - '.jar'.length())
        runtimeOnly fg.deobf("local.research:create:${createVersion}")
    }
    fileTree('run/deobf-mods') { include 'modernfix-forge-*.jar' }.each { File modernFixJar ->
        def modernFixVersion = modernFixJar.name.substring('modernfix-forge-'.length(), modernFixJar.name.length() - '.jar'.length())
        runtimeOnly fg.deobf("local.research:modernfix-forge:${modernFixVersion}")
    }
    fileTree('run/deobf-mods') { include 'architectury-*-forge.jar' }.each { File architecturyJar ->
        def architecturyVersion = architecturyJar.name.substring('architectury-'.length(), architecturyJar.name.length() - '-forge.jar'.length())
        runtimeOnly fg.deobf("local.research:architectury:${architecturyVersion}:forge")
    }
    fileTree('run/deobf-mods') { include 'cavedweller-*.jar' }.each { File caveDwellerJar ->
        def caveDwellerVersion = caveDwellerJar.name.substring('cavedweller-'.length(), caveDwellerJar.name.length() - '.jar'.length())
        runtimeOnly fg.deobf("local.research:cavedweller:${caveDwellerVersion}")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.register('prepareGameTestStructures', Copy) {
    from 'src/gametest/resources/gameteststructures'
    into 'run/gameteststructures'
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('prepareGameTestStructures')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
